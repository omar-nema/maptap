<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>maptap · for us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map" aria-label="Map of New York City"></div>

  <!-- Running score meter -->
  <div class="scorebar" id="scorebar">
    <div class="scorebar-inner">
      <span class="round-indicator" id="round-label">Round 1 / 5</span>
      <span class="score-group">
        <span class="score-label">Score</span>
        <span class="score-value" id="score-value">0</span>
        <span class="score-max" id="score-max">/ 500</span>
      </span>
      <span class="score-pop" id="score-pop" aria-hidden="true"></span>
    </div>
    <div class="score-track"><div class="score-fill" id="score-fill"></div></div>
  </div>

  <!-- Intro / prompt card -->
  <div class="card prompt-card" id="prompt-card">
    <h1 class="prompt" id="prompt-text">Where did we have our first date?</h1>
    <p class="hint" id="tap-hint">Tap the map to drop your guess.</p>
    <input type="date" id="date-input" class="date-input hidden" aria-label="Your date guess">
    <button class="btn" id="confirm-btn" disabled>Lock it in</button>
  </div>

  <!-- Result card -->
  <div class="card result-card hidden" id="result-card">
    <p class="eyebrow" id="result-eyebrow">The verdict</p>
    <h2 class="result-headline" id="result-headline"></h2>
    <p class="round-score"><span id="round-score-num">0</span><span class="round-score-max"> / 100</span> points this round</p>
    <p class="result-distance" id="result-distance"></p>
    <div class="memory">
      <p class="memory-name" id="memory-name"></p>
      <p class="memory-text" id="memory-text"></p>
    </div>
    <button class="btn" id="next-btn">Play again</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
